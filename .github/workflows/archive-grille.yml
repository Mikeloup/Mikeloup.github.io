name: Archiver la grille de diffusion

on:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-grille
  cancel-in-progress: false

jobs:
  archiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Archiver la journee ecoulee
        run: node tools/archiver-grille.mjs

      - name: Publier l'archive
        run: |
          if [ -z "$(git status --porcelain data/grille-archive)" ]; then
            echo "Rien de nouveau : aucun commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grille-archive
          git commit -m "Archive de la grille du $(TZ=Asia/Jerusalem date +%F)"
          git push
