name: Publier le site Tandem TV

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Catalogue YouTube mis de cote
        uses: actions/cache@v4
        with:
          path: data/cache.json
          # NOM DE CLE CHANGE LE 05/10/2026, ET C EST LE CORRECTIF DE FOND.
          #
          # Le 3 octobre a 16h47, une construction a vu un catalogue tronque.
          # Toutes les videos absentes de ce releve ont ete redatees du jour
          # meme : huit emissions de mai 2023 sont devenues des nouveautes, et
          # Instagram en a poste une toutes les quinze minutes.
          #
          # Ces fausses dates vivent dans le cache, et chaque construction les
          # recopie dans le cache suivant. Il y en avait 814 au 5 octobre :
          # en supprimer un ne sert a rien, « restore-keys » retombe aussitot
          # sur le precedent, tout aussi faux.
          #
          # Changer le NOM de la cle coupe la chaine d un coup. La prochaine
          # construction ne trouve plus rien, et marquerPremiereVue applique
          # alors sa regle du premier passage : chaque video recoit sa vraie
          # date de publication YouTube. Le catalogue repart propre.
          #
          # Consequence attendue et voulue : plus aucune video n est
          # « nouvelle » le temps qu une vraie nouveaute paraisse. Instagram
          # et la lettre se taisent jusque-la. C est le comportement correct.
          key: catalogue-v2-${{ github.run_id }}
          restore-keys: catalogue-v2-

      - name: Generer le site depuis YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          
        run: node build.mjs

      - name: Vignettes Instagram
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/vignette-insta.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
