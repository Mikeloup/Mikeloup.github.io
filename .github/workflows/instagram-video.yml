# -----------------------------------------------------------------------------
# Publier une nouvelle video sur Instagram, juste apres le deploiement.
#
# Pourquoi ce declenchement : Meta va chercher l'image a son adresse publique.
# La vignette 4:5 n'est en ligne qu'une fois le site deploye. Publier depuis la
# construction elle-meme arrivait donc toujours un tour trop tot, et reportait
# de deux heures. Ici, on part quand le deploiement a REUSSI : l'image existe.
#
# « workflow_run » ne se declenche que si le workflow appele s'appelle
# exactement comme ci-dessous. Si vous renommez « Publier le site Tandem TV »,
# renommez-le ici aussi, sinon ce workflow ne partira plus jamais — en silence.
#
# La memoire, c'est Instagram : aucun doublon possible, meme si la construction
# publie de son cote.
# -----------------------------------------------------------------------------

name: Instagram - nouvelle video

on:
  workflow_run:
    workflows: ["Publier le site Tandem TV"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier reellement ? (non = simple apercu)"
        required: true
        default: "non"
        type: choice
        options:
          - "non"
          - "oui"

jobs:
  publier:
    # Un deploiement rate ne met aucune image en ligne : inutile d'essayer.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # GitHub Pages met quelques secondes a servir les nouveaux fichiers apres
      # la fin du deploiement. Publier a la seconde pres ferait echouer la
      # verification de mise en ligne pour rien.
      - name: Laisser le temps a la mise en ligne
        run: sleep 45

      - name: Publier la video
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          # 13/11/2026 : repli passe de « oui » a « non ».
          # Ce workflow se declenche a CHAQUE publication du site, et le
          # Mac mini pousse la grille toutes les 15 minutes. Declenche
          # ainsi, il n'y a aucun input : le repli s'appliquait, et il
          # valait « oui » -- donc chaque deploiement publiait pour de
          # vrai. Du 11/11 au 13/11, la meme interview de Ferhat Mehenni
          # est sortie une quinzaine de fois sur tandem_tv_2.
          # Le declenchement manuel (workflow_dispatch) reste intact :
          # il fournit son propre input.
          PUBLIER: ${{ inputs.publier || 'non' }}
        run: node tools/instagram-video.mjs
